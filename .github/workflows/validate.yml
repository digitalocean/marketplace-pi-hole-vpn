name: Validate

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  packer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Packer
        uses: hashicorp/setup-packer@main
        with:
          version: latest

      - name: Packer init
        run: packer init .

      - name: Packer validate
        run: packer validate -var "do_token=ci-validate-placeholder" .

  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run shellcheck
        uses: ludeeus/action-shellcheck@master
        with:
          scandir: scripts
          severity: error
        env:
          SHELLCHECK_OPTS: --exclude=SC2034
